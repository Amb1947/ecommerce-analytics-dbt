
version: 2

models:
  - name: stg_orders
    columns:
      - name: row_id
        data_tests:
          - not_null

          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: ship_date
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sales
        data_tests:
          - not_null
  - name: fct_orders
    columns:

      - name: row_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_sk

      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_sk

      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: ship_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: location_key
        data_tests:
          - relationships:
              to: ref('dim_location')
              field: location_key